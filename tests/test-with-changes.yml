name: Test with file changes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Create a new file to simulate a change
      - name: Create a changed file
        run: |
          echo "test content $(date)" > "$GITHUB_WORKSPACE/test-change-file.txt"
          git add "$GITHUB_WORKSPACE/test-change-file.txt"
          git status

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: commit with file changes"
          repo: ${{ github.repository }}
          branch: act-harness
          empty: "false"
          file_pattern: "."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action ran (changes detected, sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT_URL: ${{ steps.action.outputs.commit-url }}
          COMMIT_HASH: ${{ steps.action.outputs.commit-hash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit-url: $COMMIT_URL"
          echo "commit-hash: $COMMIT_HASH"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, it should have produced outputs
            if [ -z "$COMMIT_URL" ]; then
              echo "FAIL: action succeeded but commit-url output is empty"
              exit 1
            fi
            if [ -z "$COMMIT_HASH" ]; then
              echo "FAIL: action succeeded but commit-hash output is empty"
              exit 1
            fi
            echo "PASS: commit created at $COMMIT_URL (hash: $COMMIT_HASH)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GraphQL API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
