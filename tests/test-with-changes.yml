name: Test with file changes scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Set up a git origin reachable inside the Docker container
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Create and stage a modified file so the action detects changes
      - name: Create and stage a modified file
        run: |
          echo "test change $(date)" > "$GITHUB_WORKSPACE/test-change.txt"
          git add "$GITHUB_WORKSPACE/test-change.txt"

      - id: action
        uses: .
        with:
          commit_message: "test: commit with changes"
          repo: ${{ github.repository }}
          branch: "act-harness"
          empty: "false"
          file_pattern: "."
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran and attempted commit (may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT_URL: ${{ steps.action.outputs.commit-url }}
          COMMIT_HASH: ${{ steps.action.outputs.commit-hash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit-url: '$COMMIT_URL'"
          echo "commit-hash: '$COMMIT_HASH'"
          if [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, outputs must be set
            if [ -z "$COMMIT_URL" ]; then
              echo "FAIL: action succeeded but commit-url is empty"
              exit 1
            fi
            if [ -z "$COMMIT_HASH" ]; then
              echo "FAIL: action succeeded but commit-hash is empty"
              exit 1
            fi
            echo "PASS: action succeeded with commit-url='$COMMIT_URL' and commit-hash='$COMMIT_HASH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
