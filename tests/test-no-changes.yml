name: Test no changes scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Set up a git origin reachable inside the Docker container
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Ensure the workspace is clean (no uncommitted changes)
      - name: Ensure clean workspace
        run: |
          git status
          git checkout -- .
          git clean -fd --exclude=.git-remote

      - id: action
        uses: .
        with:
          commit_message: "test: no changes commit"
          repo: ${{ github.repository }}
          branch: "act-harness"
          empty: "false"
          file_pattern: "."
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert action completed (no changes path exits 0 with no outputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT_URL: ${{ steps.action.outputs.commit-url }}
          COMMIT_HASH: ${{ steps.action.outputs.commit-hash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit-url: '$COMMIT_URL'"
          echo "commit-hash: '$COMMIT_HASH'"
          # When there are no changes and empty=false, the action exits 0
          # without setting any outputs (it prints "No changes detected, exiting")
          # Both outputs should be empty on success
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$COMMIT_URL" ]; then
              echo "FAIL: expected empty commit-url but got '$COMMIT_URL'"
              exit 1
            fi
            if [ -n "$COMMIT_HASH" ]; then
              echo "FAIL: expected empty commit-hash but got '$COMMIT_HASH'"
              exit 1
            fi
            echo "PASS: action exited cleanly with no outputs (no changes detected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/environment issue under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
