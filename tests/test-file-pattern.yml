name: Test file pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an untracked file outside the pattern
        run: |
          # Create a file that won't match the pattern "*.md"
          echo "some content" > /tmp/outside-pattern.txt
          # The file_pattern will be "*.md" so this won't be picked up

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_message: "test: file pattern test"
          repo: ${{ github.repository }}
          branch: act-harness
          empty: "false"
          file_pattern: "*.md"

      - name: Assert action handled file pattern gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With no matching changes for *.md pattern and empty=false,
          # the action should exit 0 (no API call needed)
          # OR it may fail if the sentinel repo is not accessible
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly with no matching changes for pattern"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
