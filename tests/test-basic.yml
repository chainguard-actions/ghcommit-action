name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to commit
        run: |
          echo "test change $(date)" > test-change.txt
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
        with:
          commit_message: "test: automated test commit"
          repo: "octocat/Hello-World"
          branch: "main"
          empty: "true"
          file_pattern: "."
      - name: Assert action ran (outputs may be empty without valid token)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "commit-url: ${{ steps.action.outputs.commit-url }}"
          echo "commit-hash: ${{ steps.action.outputs.commit-hash }}"
          # The action is expected to fail without a real token/repo,
          # but it must have been invoked with all required inputs covered.
          echo "PASS: action was invoked with all required inputs"
