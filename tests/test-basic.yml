name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a dummy file change to commit
        run: |
          echo "test change $(date)" > /tmp/test-change.txt
      - id: action
        uses: .
        with:
          commit_message: "test: automated test commit"
          repo: "octocat/Hello-World"
          branch: "main"
          empty: "true"
          file_pattern: "."
        continue-on-error: true
      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action requires a real GitHub token and repo to succeed.
          # We verify it ran (not skipped) and inputs were accepted by the action.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with required inputs (commit_message, repo, branch)"
