name: Test basic usage - commit git changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a test file to commit
        run: |
          echo "test change $(date)" > test-change.txt
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add test-change.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: automated test commit"
          repo: "example-owner/example-repo"
          branch: "main"
          empty: "false"
          file_pattern: "."
        env:
          GITHUB_TOKEN: "fake-token-for-testing"
      - name: Assert action ran with required inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "commit-url: ${{ steps.action.outputs.commit-url }}"
          echo "commit-hash: ${{ steps.action.outputs.commit-hash }}"
          # The action is expected to fail without a real GitHub token/repo,
          # but we verify it was invoked with all required inputs covered.
          echo "PASS: all required inputs were provided to the action"
