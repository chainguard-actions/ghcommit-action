name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "chore: test commit"
          repo: "owner/repo"
          branch: "main"
          empty: "true"
          file_pattern: "."
        env:
          GITHUB_TOKEN: "fake-token-for-testing"
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the token is fake and no real
          # GitHub API call can succeed in this test environment. We only verify
          # that the action was invoked with the required inputs (commit_message,
          # repo, branch) and did not crash before attempting the API call.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
