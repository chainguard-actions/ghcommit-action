name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: automated commit"
          repo: "owner/repo"
          branch: "main"
          empty: "true"
          file_pattern: "."
          repository: "."
      - name: Assert action ran with required inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to missing GitHub token / API access,
          # but we verify it was invoked with all required inputs covered.
          # A failure here means the action crashed before even attempting the API call.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with all required inputs"
