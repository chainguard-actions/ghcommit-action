name: Test basic usage - commit git changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file change
        run: |
          echo "test-$(date +%s)" > /tmp/test-change.txt
          cp /tmp/test-change.txt test-change.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: automated test commit"
          repo: "planetscale/ghcommit-action"
          branch: "main"
          empty: "true"
          file_pattern: "."
          repository: "."

      - name: Assert action ran with required inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to missing credentials in test environment,
          # but it must have been invoked (not skipped) with the required inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with required inputs (commit_message, repo, branch)"
