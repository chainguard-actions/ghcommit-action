name: Test empty commit flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure working tree is clean
        run: |
          git status
          git diff --exit-code || true
          git diff --cached --exit-code || true

      - id: action
        uses: .
        with:
          commit_message: "test: empty commit"
          repo: "some-owner/some-repo"
          branch: "act-harness"
          empty: "true"
          file_pattern: "."
        continue-on-error: true

      - name: Assert action ran (empty commit attempted, may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT_URL: ${{ steps.action.outputs.commit-url }}
          COMMIT_HASH: ${{ steps.action.outputs.commit-hash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit-url: $COMMIT_URL"
          echo "commit-hash: $COMMIT_HASH"
          # With empty=true, the action always tries to call the GitHub GraphQL API.
          # The sentinel repo does not exist, so the API call will fail.
          if [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, outputs should be set
            if [ -z "$COMMIT_URL" ]; then
              echo "FAIL: action succeeded but commit-url is empty"
              exit 1
            fi
            if [ -z "$COMMIT_HASH" ]; then
              echo "FAIL: action succeeded but commit-hash is empty"
              exit 1
            fi
            echo "PASS: empty commit created at $COMMIT_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GraphQL API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
