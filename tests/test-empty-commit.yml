name: Test empty commit scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git config
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "chore: empty commit for testing"
          repo: "octocat/Hello-World"
          branch: "main"
          empty: "true"
          file_pattern: "src/*.js"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran with empty and file_pattern inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "commit-url output: ${{ steps.action.outputs.commit-url }}"
          echo "commit-hash output: ${{ steps.action.outputs.commit-hash }}"
          # The action may fail due to missing permissions on the test repo,
          # but we verify it ran and accepted all inputs without a startup error
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with empty=true and file_pattern inputs"
