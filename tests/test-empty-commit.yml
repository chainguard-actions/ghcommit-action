name: Test empty commit (API call with sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Configure git identity
      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Ensure the workspace is truly clean
          git checkout -- .

      # With empty=true, the action will attempt a GitHub GraphQL API call even
      # with no file changes. The sentinel GITHUB_REPOSITORY does not exist on
      # GitHub, so the API call will fail. We allow failure and assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        env:
          HOME: /tmp
        with:
          commit_message: "test: empty commit"
          repo: ${{ github.repository }}
          branch: act-harness
          empty: "true"
          file_pattern: "."

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT_URL: ${{ steps.action.outputs.commit-url }}
          COMMIT_HASH: ${{ steps.action.outputs.commit-hash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit-url: '$COMMIT_URL'"
          echo "commit-hash: '$COMMIT_HASH'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMIT_URL" ]; then
              echo "FAIL: action succeeded but commit-url output is empty"
              exit 1
            fi
            if [ -z "$COMMIT_HASH" ]; then
              echo "FAIL: action succeeded but commit-hash output is empty"
              exit 1
            fi
            echo "PASS: got commit-url='$COMMIT_URL' commit-hash='$COMMIT_HASH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
