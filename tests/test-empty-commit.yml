name: Test empty commit scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_message: "test: empty commit"
          repo: ${{ github.repository }}
          branch: act-harness
          empty: "true"
          file_pattern: "."

      - name: Assert action ran and attempted API call
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT_URL: ${{ steps.action.outputs.commit-url }}
          COMMIT_HASH: ${{ steps.action.outputs.commit-hash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit-url: $COMMIT_URL"
          echo "commit-hash: $COMMIT_HASH"
          if [ "$OUTCOME" = "success" ]; then
            # If it succeeded, outputs should be set
            if [ -z "$COMMIT_URL" ]; then
              echo "FAIL: action succeeded but commit-url output is empty"
              exit 1
            fi
            if [ -z "$COMMIT_HASH" ]; then
              echo "FAIL: action succeeded but commit-hash output is empty"
              exit 1
            fi
            echo "PASS: got commit-url='$COMMIT_URL' commit-hash='$COMMIT_HASH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GraphQL API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
