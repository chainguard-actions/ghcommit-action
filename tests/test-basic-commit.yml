name: Test basic commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "chore: test commit"
          repo: "octocat/hello-world"
          branch: "main"
          empty: "true"
          file_pattern: "."
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without a valid token/repo access,
          # but it must have started (outcome is 'success' or 'failure', not 'skipped').
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs may not have been accepted"
            exit 1
          fi
          echo "PASS: action ran with required inputs (outcome=$OUTCOME)"
